<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page introuvable – OneLevel Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            font-family: 'Roboto', sans-serif;
            background: #1e1e1e;
            color: #fff;
        }
        .code {
            font-size: clamp(5rem, 22vw, 9rem);
            font-weight: 700;
            line-height: 1;
            margin: 0;
        }
        h1 { margin: 10px 0; font-size: 1.6rem; }
        p { max-width: 420px; margin: 0 0 28px; color: #ccc; line-height: 1.5; }
        .buttons { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .buttons a {
            padding: 12px 22px;
            border: 2px solid #fff;
            border-radius: 8px;
            color: #fff;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .buttons a:hover { background: #fff; color: #1e1e1e; }
        footer { margin-top: 40px; font-size: 0.85rem; color: #888; }
    </style>
</head>
<body>
    <p class="code">404</p>
    <h1>Oups, niveau introuvable !</h1>
    <p>La page que vous cherchez n'existe pas ou a été déplacée. Retournez à l'accueil pour continuer l'aventure.</p>
    <div class="buttons">
        <a href="https://onelevel-sturio.github.io/">Retour à l'accueil</a>
        <a href="https://onelevel-sturio.github.io/#games">Voir nos jeux</a>
    </div>
    <footer>&copy; <span id="year">2026</span> OneLevel Studio</footer>
    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
